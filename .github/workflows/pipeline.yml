name: CI/CD Pipeline


on:
  push:
  pull_request:

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: naru_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma Client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: packages/backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/backend/prisma/schema.prisma') }}

      - name: Set up database and generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/naru_test
        run: |
          cd packages/backend
          npx prisma migrate deploy
          if [ "${{ steps.cache-prisma.outputs.cache-hit }}" != "true" ]; then
            npx prisma generate
          fi

      - name: Run all tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/naru_test
          JWT_SECRET: test-jwt-secret-for-testing-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-testing-only
          NODE_ENV: test
        run: pnpm test

  build:
    name: Build Project
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma Client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: packages/backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/backend/prisma/schema.prisma') }}

      - name: Generate Prisma Client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
            cd packages/backend
            npx prisma generate

      - name: Build monorepo
        run: pnpm build

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No cache gate on the deploy path. pnpm generates the client into
      # node_modules/.pnpm/@prisma+client@*/node_modules/.prisma, not
      # packages/backend/node_modules/.prisma, so the cache never covered the
      # real output — and gating on it risks shipping a stale client.
      - name: Generate Prisma Client
        run: |
            cd packages/backend
            npx prisma generate

      - name: Build monorepo
        run: pnpm build

      - name: Pre-deployment setup on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/web/dist
            sudo mkdir -p /var/www/backend
            sudo chown -R ec2-user:ec2-user /var/www/web
            sudo chown -R ec2-user:ec2-user /var/www/backend

            # Deploys before the pnpm 11 fix left @naru/shared as a symlink to a
            # runner path that was never shipped. Clear any stale link so the
            # incoming one extracts cleanly rather than tar following a dead link.
            if [ -L /var/www/backend/node_modules/@naru/shared ]; then
              sudo rm -f /var/www/backend/node_modules/@naru/shared
            fi

      # pnpm 11's `deploy --legacy` symlinks workspace deps to their absolute
      # path in the monorepo checkout, so @naru/shared dangles once the bundle
      # is scp'd to EC2. Injecting copies the built package into the deploy
      # dir's .pnpm store instead, which is self-contained. Set here rather
      # than in pnpm-workspace.yaml so local dev keeps live symlinks.
      - name: Create standalone backend
        run: pnpm --config.inject-workspace-packages=true --filter @naru/backend deploy ./backend-deploy

      # Guards the failure mode that took production down: a bundle whose
      # symlinks resolve on the runner but not after scp. Checking for *broken*
      # links is not enough — the @naru/shared link pointed at an absolute path
      # that exists here and only dangled on EC2. The test that matters is
      # whether every link resolves to somewhere inside the bundle.
      #
      # Do not "fix" a failure here by dereferencing the tree (cp -rL). That
      # flattens pnpm's .pnpm store, after which packages can no longer resolve
      # their own dependencies — prisma loses @prisma/engines.
      - name: Verify bundle is self-contained
        run: |
          test -f backend-deploy/node_modules/@naru/shared/package.json || {
            echo "::error::@naru/shared missing from bundle"; exit 1; }

          # pwd -P, not pwd: readlink -f returns a fully resolved path, so a
          # logical path would never match once any parent is itself a symlink.
          ROOT=$(cd backend-deploy && pwd -P)
          find backend-deploy -type l > /tmp/bundle-links.txt
          : > /tmp/bundle-escaped.txt
          while IFS= read -r link; do
            target=$(readlink -f "$link" || true)
            case "$target" in
              "$ROOT"/*) ;;
              *) printf '%s -> %s\n' "$link" "${target:-<broken>}" >> /tmp/bundle-escaped.txt ;;
            esac
          done < /tmp/bundle-links.txt

          if [ -s /tmp/bundle-escaped.txt ]; then
            echo "::error::bundle has symlinks resolving outside itself; these will dangle on EC2:"
            head -20 /tmp/bundle-escaped.txt
            exit 1
          fi
          echo "bundle self-contained: $(du -sh backend-deploy | cut -f1), $(wc -l < /tmp/bundle-links.txt) internal symlinks"

      - name: Deploy Web to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "packages/web/dist/**"
          target: "/var/www/web/dist"
          strip_components: 3

      - name: Deploy Backend to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "backend-deploy/**"
          target: "/var/www/backend"
          strip_components: 1

      - name: Deploy Nginx Config to EC2 (Temporary)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "nginx/naru.conf"
          target: "/tmp"

      - name: Deploy Service Config to EC2 (Temporary)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "deployment/naru-backend.service,deployment/check-prisma-client-drift.cjs"
          target: "/tmp"

      - name: Post-deployment on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          script: |
            # Update Nginx config
            sudo mv /tmp/nginx/naru.conf /etc/nginx/conf.d/naru.conf
            sudo chown root:root /etc/nginx/conf.d/naru.conf

            # Install systemd service
            sudo mv /tmp/deployment/naru-backend.service /etc/systemd/system/naru-backend.service
            sudo chown root:root /etc/systemd/system/naru-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable naru-backend

            # Ensure PostgreSQL is running
            sudo systemctl start postgresql || true

            # Run backend migrations
            cd /var/www/backend
            
            echo "🔍 Verifying environment..."
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env file missing in /var/www/backend"
              echo "Please SSH into the server and create it with DATABASE_URL."
              exit 1
            fi

            # Aurora Serverless v2 runs with MinCapacity=0, so the cluster pauses
            # after inactivity and takes ~15-20s to resume. A single connection
            # attempt loses that race, so retry until it wakes.
            echo "🔍 Waking database and checking connectivity..."
            CONNECTED=0
            for attempt in $(seq 1 12); do
              if echo 'SELECT 1;' | npx prisma db execute --stdin --schema prisma/schema.prisma > /tmp/naru-dbcheck.log 2>&1; then
                echo "✅ Database reachable (attempt $attempt)"
                CONNECTED=1
                break
              fi
              echo "   attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            if [ "$CONNECTED" -ne 1 ]; then
              echo "❌ ERROR: Cannot connect to database after 12 attempts (~2 min)."
              echo "--- last error ---"
              cat /tmp/naru-dbcheck.log || true
              exit 1
            fi

            # The deploy artifact merges into an existing node_modules, so the
            # generated client at the path Node resolves can be older than the
            # schema we just shipped. A stale client throws
            # PrismaClientValidationError on every query naming a newer field
            # (it broke Family/Child lists after the photos columns landed), so
            # regenerate here where the resolution path is the real one.
            echo "🔧 Regenerating Prisma client against the deployed schema..."
            if ! npx prisma generate; then
              echo "❌ ERROR: Prisma client generation failed."
              exit 1
            fi

            echo "🚀 Running migrations..."
            if ! npx prisma migrate deploy; then
              echo "❌ ERROR: Prisma migration failed."
              exit 1
            fi

            # Fail loudly here rather than serving 500s. Compares every model in
            # the deployed schema against the resolved client's DMMF. Must be
            # copied into the app tree first — Node resolves @prisma/client
            # relative to the script's own directory, not the cwd.
            echo "🔍 Verifying client/schema agreement..."
            cp /tmp/deployment/check-prisma-client-drift.cjs ./check-prisma-client-drift.cjs
            if ! node ./check-prisma-client-drift.cjs prisma/schema.prisma; then
              rm -f ./check-prisma-client-drift.cjs
              echo "❌ ERROR: Generated Prisma client does not match the schema."
              exit 1
            fi
            rm -f ./check-prisma-client-drift.cjs

            # Restart services
            sudo systemctl restart nginx
            sudo systemctl restart naru-backend

            # A green deploy that leaves the backend crash-looping is worse than a
            # red one, so gate success on the app actually answering.
            echo "🔍 Health check..."
            HEALTHY=0
            for attempt in $(seq 1 15); do
              if curl -sf -m 5 http://127.0.0.1:3000/api/health > /dev/null 2>&1 \
                || curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null 2>&1; then
                echo "✅ Backend healthy (attempt $attempt)"
                HEALTHY=1
                break
              fi
              sleep 4
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ ERROR: Backend did not become healthy within 60s."
              sudo journalctl -u naru-backend -n 50 --no-pager || true
              exit 1
            fi
