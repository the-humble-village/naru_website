name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pipeline:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: naru_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run Prisma migrations on test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naru_test
        run: |
          cd packages/backend
          npx prisma migrate deploy

      - name: Generate Prisma Client
        run: |
            cd packages/backend
            npx prisma generate

      - name: Run all tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naru_test
          JWT_SECRET: test-jwt-secret-for-testing-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-testing-only
        run: pnpm test

      - name: Build monorepo
        # pnpm test already triggers build due to turbo.json, 
        # but we run it explicitly to ensure all artifacts (including web) are ready.
        run: pnpm build

      - name: Create standalone backend
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm --filter @naru/backend deploy ./backend-deploy

      - name: Deploy Web to EC2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "packages/web/dist/**"
          target: "/var/www/web/dist"
          strip_components: 3

      - name: Deploy Backend to EC2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "backend-deploy/**"
          target: "/var/www/backend"
          strip_components: 1

      - name: Deploy Nginx Config to EC2 (Temporary)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "nginx/naru.conf"
          target: "/tmp"

      - name: Post-deployment on EC2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          script: |
            # Ensure permissions
            sudo chown -R ec2-user:ec2-user /var/www/web/dist
            sudo chown -R ec2-user:ec2-user /var/www/backend

            # Update Nginx config
            sudo mv /tmp/nginx/naru.conf /etc/nginx/conf.d/naru.conf
            sudo chown root:root /etc/nginx/conf.d/naru.conf

            # Run backend migrations
            cd /var/www/backend
            # Note: DATABASE_URL should be in the .env file on the server
            npx prisma migrate deploy

            # Restart services
            sudo systemctl restart nginx
            # pm2 restart naru-backend || pm2 start dist/index.js --name naru-backend
