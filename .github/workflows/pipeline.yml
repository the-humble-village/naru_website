name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint -- --cache-dir=".turbo"

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: naru_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma Client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: packages/backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/backend/prisma/schema.prisma') }}

      - name: Set up database and generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/naru_test
        run: |
          cd packages/backend
          npx prisma migrate deploy
          if [ "${{ steps.cache-prisma.outputs.cache-hit }}" != "true" ]; then
            npx prisma generate
          fi

      - name: Run all tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/naru_test
          JWT_SECRET: test-jwt-secret-for-testing-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-testing-only
          NODE_ENV: test
        run: pnpm test -- --cache-dir=".turbo"

  build:
    name: Build Project
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma Client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: packages/backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/backend/prisma/schema.prisma') }}

      - name: Generate Prisma Client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
            cd packages/backend
            npx prisma generate

      - name: Build monorepo
        run: pnpm build -- --cache-dir=".turbo"

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma Client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: packages/backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/backend/prisma/schema.prisma') }}

      - name: Generate Prisma Client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
            cd packages/backend
            npx prisma generate

      - name: Build monorepo
        run: pnpm build -- --cache-dir=".turbo"

      - name: Pre-deployment setup on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/web/dist
            sudo mkdir -p /var/www/backend
            sudo chown -R ec2-user:ec2-user /var/www/web
            sudo chown -R ec2-user:ec2-user /var/www/backend

      - name: Create standalone backend
        run: pnpm --filter @naru/backend deploy --legacy ./backend-deploy

      - name: Deploy Web to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "packages/web/dist/**"
          target: "/var/www/web/dist"
          strip_components: 3

      - name: Deploy Backend to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "backend-deploy/**"
          target: "/var/www/backend"
          strip_components: 1

      - name: Deploy Nginx Config to EC2 (Temporary)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          port: 22
          source: "nginx/naru.conf"
          target: "/tmp"

      - name: Post-deployment on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.NARU_GITHUB_PRIVATE_KEY }}
          script: |
            # Update Nginx config
            sudo mv /tmp/nginx/naru.conf /etc/nginx/conf.d/naru.conf
            sudo chown root:root /etc/nginx/conf.d/naru.conf

            # Run backend migrations
            cd /var/www/backend
            # Note: DATABASE_URL should be in the .env file on the server
            npx prisma migrate deploy

            # Restart services
            sudo systemctl restart nginx
            # pm2 restart naru-backend || pm2 start dist/index.js --name naru-backend
