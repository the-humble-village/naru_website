name: Tests

on:
  pull_request:
  workflow_run:
    workflows: ["Linting"]
    types: [completed]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: naru_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations on test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naru_test
        run: |
          cd packages/backend
          npx prisma migrate deploy

      - name: Generate Prisma Client
        run: |
            cd packages/backend
            npx prisma generate

      - name: Run all tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naru_test
          JWT_SECRET: test-jwt-secret-for-testing-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-testing-only
        run: pnpm test
