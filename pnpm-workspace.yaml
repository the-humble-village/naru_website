packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.9'
  - '@turbo/darwin-arm64@2.10.9'
  - '@turbo/linux-64@2.10.9'
  - '@turbo/linux-arm64@2.10.9'
  - '@turbo/windows-64@2.10.9'
  - '@turbo/windows-arm64@2.10.9'
  - turbo@2.10.9

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - bcrypt
  - esbuild

overrides:
  tar: ^7.5.15
  # Prisma 6 pins vulnerable versions of these exactly. Drop both when Prisma is upgraded.
  '@prisma/config>deepmerge-ts': ^8.0.2
  '@prisma/config>effect': ^3.22.1
